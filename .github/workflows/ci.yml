name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (backend)
        run: pipx run ruff==0.6.9 check backend/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jarvis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/jarvis
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-not-for-prod-minimum-32-characters
      OPENAI_API_KEY: ""
      JARVIS_FAKE_LLM: "true"
      CI_WITH_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e:
    name: E2E Playwright (fake LLM)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jarvis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/jarvis
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-not-for-prod-minimum-32-characters
      OPENAI_API_KEY: ""
      JARVIS_FAKE_LLM: "true"
      REALTIME_ENABLED: "false"
      NEXT_PUBLIC_BACKEND_WS_URL: ws://localhost:8000/ws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements_backend.txt
      - name: Start backend (fake LLM)
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 --log-level warning &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && { echo "backend up"; break; }
            sleep 1
          done
          curl -sf http://localhost:8000/health

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (boots `next dev` via webServer)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: tmp/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.backend  -t jarvis-backend:ci .
      - run: docker build -f Dockerfile.frontend -t jarvis-frontend:ci .
      - run: docker build -f Dockerfile.nginx    -t jarvis-nginx:ci .
